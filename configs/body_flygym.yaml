simulation:
  backend: flygym
  flygym_version_assumption: "2.1.x or compatible 2.x"
  mujoco_backend: native
  notes:
    - "Set BODY_BACKEND=flygym (or SIMULATION_BACKEND=flygym) to use this adapter."
    - "Repository defaults to BODY_BACKEND=mock for deterministic CI."
    - "Install extras with: uv sync --all-extras --dev"
    - "If host runtime cannot initialize FlyGym/MuJoCo, use Docker path documented in README."
