[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flybot"]

[project]
name = "flybot"
version = "0.1.0"
description = "FlyBot embodied-agent prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "numpy>=2.3.3",
  "openai>=1.107.0",
  "pillow>=11.3.0",
  "pydantic>=2.11.9",
  "pydantic-settings>=2.11.0",
  "pyyaml>=6.0.3",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
flygym = [
  "flygym>=2.1.0,<3.0.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pyright>=1.1.405",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.13.0",
  "types-pyyaml>=6.0.12.20250915",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "apps/api/src",
  "packages/flybot_core/src",
  "packages/flybot_body_flygym/src",
  "packages/flybot_flycore/src",
  "packages/flybot_safety/src",
  "packages/flybot_perception/src",
  "packages/flybot_brain/src",
  "packages/flybot_executive/src",
  "packages/flybot_telemetry/src",
  "scripts",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = []
mypy_path = [
  "apps/api/src",
  "packages/flybot_core/src",
  "packages/flybot_body_flygym/src",
  "packages/flybot_flycore/src",
  "packages/flybot_safety/src",
  "packages/flybot_perception/src",
  "packages/flybot_brain/src",
  "packages/flybot_executive/src",
  "packages/flybot_telemetry/src",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportDeprecated = "none"
reportUnknownVariableType = "none"
include = [
  "apps/api/src",
  "packages/flybot_core/src",
  "packages/flybot_body_flygym/src",
  "packages/flybot_flycore/src",
  "packages/flybot_safety/src",
  "packages/flybot_perception/src",
  "packages/flybot_brain/src",
  "packages/flybot_executive/src",
  "packages/flybot_telemetry/src",
  "scripts",
  "tests",
]
extraPaths = [
  "apps/api/src",
  "packages/flybot_core/src",
  "packages/flybot_body_flygym/src",
  "packages/flybot_flycore/src",
  "packages/flybot_safety/src",
  "packages/flybot_perception/src",
  "packages/flybot_brain/src",
  "packages/flybot_executive/src",
  "packages/flybot_telemetry/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
